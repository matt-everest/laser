<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generator komódek do cięcia laserem</title>
<style>
#kg{--bg:#f3f7fc;--ink:#18314c;--muted:#5a6d84;--line:#d7e3f2;--accent:#1756aa;--accent-dark:#0d2c4e;--focus:#e39318;--pill:#e8503f;--row-hover:#eef5ff;--sky:#00a4ff;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.45;color:var(--ink);background:var(--bg);margin:0 auto;max-width:1480px;box-sizing:border-box;padding-bottom:6px}
#kg *{box-sizing:border-box}
#kg :focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#kg .kg-top{background:var(--accent-dark);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:3px solid var(--sky)}
#kg .kg-pill{background:var(--pill);color:#fff;font-size:11px;font-weight:700;letter-spacing:.07em;padding:3px 10px;border-radius:999px;white-space:nowrap}
#kg .kg-top h1{margin:0;font-size:19px;line-height:1.2;font-weight:700}
#kg .kg-top p{margin:0 0 0 auto;color:#b9cfeb;font-size:13px}
@media(max-width:900px){#kg .kg-top p{display:none}}
#kg .kg-layout{display:grid;grid-template-columns:288px minmax(0,1fr);gap:16px;padding:14px;align-items:start}
@media(max-width:900px){#kg .kg-layout{grid-template-columns:1fr}}
#kg .kg-side{position:sticky;top:10px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 14px 12px;max-height:calc(100vh - 20px);overflow:auto}
@media(max-width:900px){#kg .kg-side{position:static;max-height:none}}
#kg .kg-presets{display:flex;gap:5px;margin:0 0 4px}
#kg .kg-chip{flex:1;background:#eef5ff;color:var(--accent);border:1px solid #c8dcf3;border-radius:8px;padding:5px 4px;font-size:12px;cursor:pointer;font-weight:600;font-family:inherit;line-height:1.2}
#kg .kg-chip:hover{background:#dcebfc}
#kg .kg-group{font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px;padding-top:12px;border-top:1px solid var(--line)}
#kg .kg-side>.kg-group:first-child{border-top:0;margin-top:2px;padding-top:0}
#kg details.kg-adv{border-top:1px solid var(--line);margin-top:12px}
#kg details.kg-adv summary{cursor:pointer;list-style:none;font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 0 4px;display:flex;justify-content:space-between}
#kg details.kg-adv summary::-webkit-details-marker{display:none}
#kg details.kg-adv summary::after{content:"+";font-size:16px;line-height:1;color:var(--accent)}
#kg details.kg-adv[open] summary::after{content:"−"}
#kg .kg-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:5px 0;font-size:14px}
#kg .kg-row label{flex:1;line-height:1.25}
#kg .kg-inp{display:flex;align-items:center;gap:4px}
#kg .kg-inp input,#kg .kg-inp select{width:76px;height:32px;padding:3px 8px;border:1px solid #bccde1;border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
#kg .kg-inp select{width:100%}
#kg .kg-row.kg-stack{flex-direction:column;align-items:stretch;gap:3px}
#kg .kg-row.kg-stack .kg-inp{width:100%}
#kg .kg-inp input:hover,#kg .kg-inp select:hover{border-color:var(--accent)}
#kg .kg-inp .kg-u{font-size:12px;color:var(--muted);width:22px}
#kg .kg-hint{font-size:12px;color:var(--muted);margin:0 0 6px;line-height:1.35}
#kg .kg-reset{margin-top:12px;width:100%}
#kg button{font-family:inherit;font-size:14px;border-radius:9px;padding:7px 14px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:600;line-height:1.2}
#kg button:hover{background:#114690}
#kg button.kg-sec{background:#fff;color:var(--accent)}
#kg button.kg-sec:hover{background:var(--row-hover)}
#kg button.kg-mini{padding:5px 10px;font-size:13px}
#kg .kg-sum{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;margin:0 0 10px;font-size:14px;color:var(--muted)}
#kg .kg-sum .kg-big{background:var(--accent-dark);color:#fff;border-radius:999px;padding:4px 14px;font-size:14px;font-weight:600}
#kg .kg-sum .kg-big b{font-size:18px;margin-right:5px;color:#fff}
#kg .kg-sum span b{color:var(--ink)}
#kg .kg-msg{border-radius:10px;padding:7px 12px;margin:0 0 8px;font-size:14px}
#kg .kg-err{background:#fdecea;border-left:5px solid var(--pill);color:#8a1c12}
#kg .kg-warn{background:#fff6e5;border-left:5px solid var(--focus);color:#6b4600}
#kg .kg-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:0 0 10px}
#kg .kg-tabs{display:inline-flex;background:#e3edf8;border-radius:10px;padding:3px;gap:2px}
#kg .kg-tab{background:transparent;color:var(--accent-dark);border:0;padding:6px 16px}
#kg .kg-tab:hover{background:#d3e3f5}
#kg .kg-tab.on{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(13,44,78,.18)}
#kg .kg-dl{display:flex;gap:6px;flex-wrap:wrap}
#kg .kg-stage{position:relative;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#f3f6fa}
#kg canvas.kg-main{width:100%;height:clamp(360px,calc(100vh - 300px),760px);cursor:grab;touch-action:none}
#kg canvas.kg-main:active{cursor:grabbing}
#kg .kg-views{position:absolute;left:10px;top:10px;display:flex;flex-wrap:wrap;gap:0;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:10px;padding:3px}
#kg .kg-views button{background:transparent;color:var(--accent-dark);border:0;padding:4px 10px;font-size:13px;border-radius:7px}
#kg .kg-views button:hover{background:var(--row-hover)}
#kg .kg-views button.on{background:var(--accent-dark);color:#fff}
#kg .kg-tip{position:absolute;right:14px;top:14px;font-size:12px;color:var(--muted);pointer-events:none}
#kg .kg-ctrl{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding:9px 12px;background:#fff;border-top:1px solid var(--line);font-size:13px;color:var(--ink)}
#kg .kg-ctrl label{display:flex;align-items:center;gap:7px}
#kg .kg-ctrl input[type=range]{width:110px;accent-color:var(--accent)}
#kg .kg-ctrl select{height:28px;padding:2px 6px;border:1px solid #bccde1;border-radius:8px;font-size:13px;background:#fff;max-width:200px;font-family:inherit}
#kg .kg-ctrl .kg-mini{margin-left:auto}
#kg .kg-view{background:transparent}
#kg .kg-num{flex:0 0 26px;width:26px;height:26px;border-radius:50%;color:#fff;font-size:13px;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
#kg .kg-card{border:1px solid var(--line);border-radius:13px;margin:0 0 12px;background:#fff;overflow:hidden}
#kg .kg-ch{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#eaf2fb;padding:8px 14px;font-size:14px}
#kg .kg-ch span.t{display:flex;align-items:center;gap:9px}
#kg .kg-cb{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;padding:12px}
@media(max-width:1150px){#kg .kg-cb{grid-template-columns:1fr}}
#kg .kg-cb svg{display:block;width:100%;height:auto;border-radius:8px}
#kg table{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px}
#kg th,#kg td{border-bottom:1px solid var(--line);padding:3px 7px;text-align:left}
#kg th{background:#f4f8fc;color:var(--muted);font-weight:600}
#kg tr:hover td{background:var(--row-hover)}
#kg details.kg-list{border:1px solid var(--line);border-radius:13px;padding:2px 14px 8px;margin:0 0 12px;background:#fff}
#kg details.kg-list summary{cursor:pointer;font-weight:700;padding:8px 0;font-size:14px}
#kg .kg-note{font-size:12px;color:var(--muted);margin:8px 2px 0;line-height:1.4}
#kg .kg-foot{text-align:center;color:var(--muted);font-size:12px;padding:6px 0 10px}
@media print{#kg .kg-side,#kg .kg-bar,#kg .kg-ctrl,#kg .kg-top p{display:none}#kg .kg-layout{display:block}}
</style>
</head>
<body>
<div id="kg">
  <header class="kg-top">
    <span class="kg-pill">CIĘCIE LASEREM</span>
    <h1>Generator komódek z szufladami</h1>
    <p>Ustaw wymiary, obejrzyj szafkę w 3D i pobierz pliki do lasera.</p>
  </header>
  <div class="kg-layout">
    <aside class="kg-side" aria-label="Ustawienia szafki" id="kg-form"></aside>
    <main>
      <div id="kg-status" aria-live="polite"></div>
      <div class="kg-bar">
        <div class="kg-tabs" role="tablist">
          <button type="button" class="kg-tab on" id="kg-tab-front" role="tab">Szafka 3D</button>
          <button type="button" class="kg-tab" id="kg-tab-sheet" role="tab">Arkusze i części</button>
        </div>
        <div class="kg-dl">
          <button type="button" id="kg-svg" title="Wszystkie arkusze w jednym pliku SVG">Pobierz SVG</button>
          <button type="button" id="kg-dxf" class="kg-sec" title="Wszystkie arkusze w jednym pliku DXF">Pobierz DXF</button>
        </div>
      </div>
      <section class="kg-view" id="kg-view"></section>
      <p class="kg-note">W plikach czerwony kolor to cięcie, niebieski to opisy części.</p>
    </main>
  </div>
  <div class="kg-foot">Sky Blue Education · skyblue.education</div>
</div>

<script>
(function (root) {
  'use strict';

  /* stałe: zmień tutaj, jeśli używasz innego materiału lub arkusza */
  var DEF = {
    W: 200, H: 180, D: 110, rows: 3, cols: 2,
    T: 3, kerf: 0.1, finger: 10, clear: 0.4, backGap: 1.5,
    feet: 'none', feetH: 16, feetW: 14,
    handle: 'knob', hsize: 4, hdepth: 8, pattern: 'none', patSize: 8, seed: 1,
    frameEngrave: false, labels: true,
    sheetW: 600, sheetH: 300
  };

  var HANDLE_DEFAULT_SIZE = { knob: 4, pull: 22, rect: 22, vee: 24, slot: 30, none: 4 };

  var FIELDS = [
    { g: 'Wymiary zewnętrzne w mm' },
    { id: 'W', l: 'Szerokość', min: 60, max: 600, step: 1 },
    { id: 'H', l: 'Wysokość', min: 60, max: 600, step: 1 },
    { id: 'D', l: 'Głębokość', min: 40, max: 400, step: 1 },
    { g: 'Szuflady' },
    { id: 'rows', l: 'Szuflady w pionie', min: 1, max: 8, step: 1 },
    { id: 'cols', l: 'Szuflady w poziomie', min: 1, max: 4, step: 1 },
    { g: 'Uchwyt' },
    { id: 'handle', l: 'Rodzaj uchwytu', t: 'select', opts: [['knob', 'Otwór na gałkę'], ['pull', 'Wycięcie półokrągłe na palec'], ['rect', 'Wycięcie prostokątne'], ['vee', 'Wycięcie trójkątne'], ['slot', 'Podłużny otwór'], ['none', 'Bez uchwytu']] },
    { id: 'hsize', l: 'Rozmiar uchwytu', min: 2, max: 80, step: 0.5 },
    { id: 'hdepth', l: 'Głębokość wycięcia', min: 3, max: 40, step: 0.5 },
    { g: 'Luzy i materiał' },
    { id: 'kerf', l: 'Kerf (korekta cięcia)', min: 0, max: 0.6, step: 0.01 },
    { id: 'clear', l: 'Luz szuflady z boków', min: 0.1, max: 2, step: 0.05 },
    { id: 'backGap', l: 'Luz z tyłu szuflady', min: 0.5, max: 8, step: 0.5 },
    { id: 'T', l: 'Grubość materiału', min: 1.5, max: 10, step: 0.1 },
    { g: 'Arkusz materiału w mm' },
    { id: 'sheetW', l: 'Szerokość arkusza', min: 100, max: 2000, step: 10 },
    { id: 'sheetH', l: 'Wysokość arkusza', min: 100, max: 2000, step: 10 }
  ];

  /* ---------- pomocnicze funkcje geometryczne ---------- */

  var EPS = 1e-7;
  function near(a, b) { return Math.abs(a[0] - b[0]) < EPS && Math.abs(a[1] - b[1]) < EPS; }
  function area(P) { var s = 0, i, a, b; for (i = 0; i < P.length; i++) { a = P[i]; b = P[(i + 1) % P.length]; s += a[0] * b[1] - b[0] * a[1]; } return s / 2; }
  function orient(P, ccw) { return ((area(P) > 0) === ccw) ? P : P.slice().reverse(); }
  function rect(x0, y0, x1, y1) { return [[x0, y0], [x0, y1], [x1, y1], [x1, y0]]; }
  function rnd(n) { var x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); }

  function clean(P) {
    var Q = [], changed = true, i, a, b, c, cr, dt;
    P.forEach(function (p) { var l = Q[Q.length - 1]; if (!l || !near(l, p)) { Q.push(p); } });
    while (Q.length > 1 && near(Q[0], Q[Q.length - 1])) { Q.pop(); }
    while (changed) {
      changed = false;
      for (i = 0; i < Q.length; i++) {
        a = Q[(i + Q.length - 1) % Q.length]; b = Q[i]; c = Q[(i + 1) % Q.length];
        cr = (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]);
        dt = (b[0] - a[0]) * (c[0] - b[0]) + (b[1] - a[1]) * (c[1] - b[1]);
        if (Math.abs(cr) < 1e-9 && dt > 0) { Q.splice(i, 1); changed = true; break; }
      }
    }
    return Q;
  }

  /* przesunięcie konturu w prawo o s (kontur zewnętrzny CCW, otwory CW, materiał po lewej) */
  function offsetPoly(P, s) {
    var n = P.length, R = [], i, a, b, c, l1, l2, d1, d2, r1, r2, den;
    for (i = 0; i < n; i++) {
      a = P[(i + n - 1) % n]; b = P[i]; c = P[(i + 1) % n];
      l1 = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1; l2 = Math.hypot(c[0] - b[0], c[1] - b[1]) || 1;
      d1 = [(b[0] - a[0]) / l1, (b[1] - a[1]) / l1]; d2 = [(c[0] - b[0]) / l2, (c[1] - b[1]) / l2];
      r1 = [d1[1], -d1[0]]; r2 = [d2[1], -d2[0]];
      den = 1 + r1[0] * r2[0] + r1[1] * r2[1];
      if (den < 1e-6) { den = 1e-6; }
      R.push([b[0] + (r1[0] + r2[0]) * s / den, b[1] + (r1[1] + r2[1]) * s / den]);
    }
    return R;
  }

  function distPointPoly(P, x, y) {
    var best = Infinity, inside = false, i, j, a, b, dx, dy, t, px, py;
    for (i = 0, j = P.length - 1; i < P.length; j = i++) {
      a = P[i]; b = P[j];
      if (((a[1] > y) !== (b[1] > y)) && (x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0])) { inside = !inside; }
      dx = b[0] - a[0]; dy = b[1] - a[1];
      t = dx * dx + dy * dy ? ((x - a[0]) * dx + (y - a[1]) * dy) / (dx * dx + dy * dy) : 0;
      t = Math.max(0, Math.min(1, t));
      px = a[0] + t * dx; py = a[1] + t * dy;
      best = Math.min(best, Math.hypot(x - px, y - py));
    }
    return inside ? 0 : best;
  }

  /* podział długości L na zęby: zaczyna i kończy zębem, z marginesem m na końcach */
  function segs(L, f, m) {
    var mm = Math.min(m, L / 4), U = L - 2 * mm, k, t, out = [], i, a;
    if (U <= 0.5) { return []; }
    k = Math.max(1, Math.round((U / f + 1) / 2));
    t = U / (2 * k - 1);
    for (i = 0; i < k; i++) { a = mm + 2 * i * t; out.push([a, a + t]); }
    return out;
  }
  function tabs(list, off, d) { return list.map(function (s) { return { a: s[0] + off, b: s[1] + off, d: d }; }); }

  /* kontur prostokąta w x h z wypustkami (d dodatnie) lub wycięciami (d ujemne) na krawędziach */
  function outline(w, h, E) {
    var P = [[0, 0]];
    function srt(arr, desc) { return (arr || []).slice().sort(function (p, q) { return desc ? q.a - p.a : p.a - q.a; }); }
    function addPoly(pts, rev) { (rev ? pts.slice().reverse() : pts).forEach(function (q) { P.push(q); }); }
    srt(E.b, false).forEach(function (it) { if (it.poly) { addPoly(it.poly, false); } else { P.push([it.a, 0], [it.a, -it.d], [it.b, -it.d], [it.b, 0]); } });
    P.push([w, 0]);
    srt(E.r, false).forEach(function (it) { if (it.poly) { addPoly(it.poly, false); } else { P.push([w, it.a], [w + it.d, it.a], [w + it.d, it.b], [w, it.b]); } });
    P.push([w, h]);
    srt(E.t, true).forEach(function (it) { if (it.poly) { addPoly(it.poly, true); } else { P.push([it.b, h], [it.b, h + it.d], [it.a, h + it.d], [it.a, h]); } });
    P.push([0, h]);
    srt(E.l, true).forEach(function (it) { if (it.poly) { addPoly(it.poly, true); } else { P.push([0, it.b], [-it.d, it.b], [-it.d, it.a], [0, it.a]); } });
    return clean(P);
  }

  function circlePoly(cx, cy, r, n) {
    var a = [], i, t;
    for (i = 0; i < n; i++) { t = 2 * Math.PI * i / n; a.push([cx + r * Math.cos(t), cy + r * Math.sin(t)]); }
    return a;
  }

  /* ---------- wzory na frontach ---------- */

  function pattern(type, w, h, T, size, excl) {
    var fi = T + 2, pm = fi + 3.5;
    var reg = { x0: pm, y0: pm, x1: w - pm, y1: h - pm };
    var RW = reg.x1 - reg.x0, RH = reg.y1 - reg.y0;
    var cx = (reg.x0 + reg.x1) / 2, cy = (reg.y0 + reg.y1) / 2, out = [];
    if (type === 'none' || RW < size || RH < size) { return out; }

    function inside(P) { return P.every(function (q) { return q[0] >= reg.x0 - 1e-6 && q[0] <= reg.x1 + 1e-6 && q[1] >= reg.y0 - 1e-6 && q[1] <= reg.y1 + 1e-6; }); }
    function ok(P) { if (!inside(P)) { return false; } if (excl && distPointPoly(P, excl.x, excl.y) < excl.r) { return false; } return true; }
    function grid(px, py, mk, stag) {
      var N = Math.ceil(RW / px) + 1, M = Math.ceil(RH / py) + 1, i, j, x, y, P;
      for (j = -M; j <= M; j++) {
        for (i = -N; i <= N; i++) {
          x = cx + i * px + ((stag && (((j % 2) + 2) % 2 === 1)) ? px / 2 : 0);
          y = cy + j * py;
          P = mk(x, y);
          if (ok(P)) { out.push(P); }
        }
      }
    }

    if (type === 'circles') {
      grid(size * 1.7, size * 1.7, function (x, y) { return circlePoly(x, y, size / 2, 28); }, false);
    } else if (type === 'diamonds') {
      var hd = size * 0.65;
      grid(hd * 2.5, hd * 2.5, function (x, y) { return [[x - hd, y], [x, y + hd], [x + hd, y], [x, y - hd]]; }, false);
    } else if (type === 'slats') {
      var sw = Math.max(2, size * 0.35), ln = RH * 0.72, rr = sw / 2;
      grid(sw * 2.4, RH * 10, function (x, y) {
        var P = [], i, t;
        for (i = 0; i <= 8; i++) { t = Math.PI * i / 8; P.push([x + rr * Math.cos(t), y + ln / 2 - rr + rr * Math.sin(t)]); }
        for (i = 0; i <= 8; i++) { t = Math.PI + Math.PI * i / 8; P.push([x + rr * Math.cos(t), y - ln / 2 + rr + rr * Math.sin(t)]); }
        return P;
      }, false);
    } else if (type === 'hex') {
      var hr = size * 0.55, px = Math.sqrt(3) * hr + 1.6, py = 1.5 * hr + 1.4;
      grid(px, py, function (x, y) {
        var P = [], i, t;
        for (i = 0; i < 6; i++) { t = Math.PI / 6 + Math.PI / 3 * i; P.push([x + hr * Math.cos(t), y + hr * Math.sin(t)]); }
        return P;
      }, true);
    } else if (type === 'windows') {
      var ww = size * 1.5, wh = RH * 0.8, ar = ww / 2;
      grid(ww * 1.5, RH * 10, function (x, y) {
        var P = [[x - ar, y - wh / 2], [x + ar, y - wh / 2]], i, t;
        for (i = 0; i <= 10; i++) { t = Math.PI * i / 10; P.push([x + ar * Math.cos(t), y + wh / 2 - ar + ar * Math.sin(t)]); }
        return P;
      }, false);
    }
    return out;
  }

  /* ---------- budowa wszystkich części ---------- */

  var VX = [1, 0, 0], VY = [0, 1, 0], VZ = [0, 0, 1];

  function build(p) {
    var warn = [], parts = [], info = { fronts: [] };

        '<span><b>' + (p.rows * p.cols) + '</b> ' + plural(p.rows * p.cols, 'szuflada', 'szuflady', 'szuflad') + ' (' + p.rows + ' × ' + p.cols + '), front ' + f1(dr.w) + ' × ' + f1(dr.h) + ' mm</span></div>' +
        warn.map(function (w) { return '<div class="kg-msg kg-warn">' + w + '</div>'; }).join('');
      if (mode === 'front') { show3D(); } else { showSheets(); }
    }

    function download(name, text, type) {
      var blob = new Blob([text], { type: type }), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 500);
    }
    function baseName() { var p = last.p; return 'komodka_' + p.W + 'x' + p.H + 'x' + p.D + '_' + p.rows + 'x' + p.cols; }

    document.getElementById('kg-svg').addEventListener('click', function () { if (last) { download(baseName() + '.svg', toSVG(last.L, false, last.p.labels), 'image/svg+xml'); } });
    document.getElementById('kg-dxf').addEventListener('click', function () { if (last) { download(baseName() + '.dxf', toDXF(last.L), 'application/dxf'); } });
    function setMode(m) {
      mode = m;
      document.getElementById('kg-tab-front').className = 'kg-tab' + (m === 'front' ? ' on' : '');
      document.getElementById('kg-tab-sheet').className = 'kg-tab' + (m === 'sheet' ? ' on' : '');
      document.getElementById('kg-tab-front').setAttribute('aria-selected', m === 'front');
      document.getElementById('kg-tab-sheet').setAttribute('aria-selected', m === 'sheet');
      if (last) { if (m === 'front') { show3D(); } else { showSheets(); } }
    }
    document.getElementById('kg-tab-front').addEventListener('click', function () { setMode('front'); });
    document.getElementById('kg-tab-sheet').addEventListener('click', function () { setMode('sheet'); });
    window.addEventListener('resize', function () { if (mode === 'front') { redrawMain(); } });
    render();
  }

  if (typeof document !== 'undefined' && document.getElementById('kg-form')) {
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); } else { init(); }
  }
})(this);
</script>
</body>
</html>
